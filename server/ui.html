<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Elyx overview</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fff; --panel: #fbfbfa; --hover: #f0f0ee; --active: #e7eefc; --line: #e6e6e3;
  --ink: #1d1d1b; --muted: #6f6f6a; --accent: #1668e3; --on-accent: #fff; --danger: #c0352b;
  --canvas: #e4e4e0; --shadow: 0 6px 24px rgb(0 0 0 / .14); --r: 8px; --ease: .14s ease;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1a; --panel: #212120; --hover: #2c2c2a; --active: #203252; --line: #333331;
    --ink: #ededea; --muted: #9c9c96; --accent: #6ea4ff; --on-accent: #0d1b33; --danger: #ff8d82;
    --canvas: #131312; --shadow: 0 6px 24px rgb(0 0 0 / .5);
  }
}
* { box-sizing: border-box; margin: 0 }
html, body { height: 100% }
body {
  display: grid; grid-template-columns: 232px minmax(0, 1fr) auto; height: 100dvh; overflow: hidden;
  background: var(--bg); color: var(--ink); font: 13px/1.45 Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
}
body.no-nav { grid-template-columns: minmax(0, 1fr) auto }
body.no-nav #nav { display: none }
button, input, textarea, select { font: inherit; color: inherit }
button { background: none; border: 0; cursor: pointer }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
[hidden] { display: none !important }
h2, h3 { font-size: inherit; font-weight: 600 }
.muted { color: var(--muted) }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px }

/* Navigation */
#nav { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line) }
#nav header { padding: 14px 14px 10px; font-size: 14px; font-weight: 600 }
#search { margin: 0 10px 8px; padding: 6px 9px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r) }
#links { flex: 1; overflow-y: auto; padding: 0 6px 14px }
.group { display: flex; justify-content: space-between; margin-top: 14px; padding: 4px 8px; border-radius: 6px; font-weight: 600 }
.row { display: block; padding: 3px 8px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background var(--ease) }
.row.sub { padding-left: 20px; color: var(--muted) }
.group:hover, .row:hover { background: var(--hover) }
[aria-current="page"] { background: var(--active); color: var(--ink) }

/* Stage */
#stage { position: relative; min-width: 0; overflow: hidden; background: var(--canvas) }
#stage.busy::before {
  content: ""; position: absolute; z-index: 3; inset: 0 0 auto; height: 2px; background: var(--accent);
  animation: load 1s ease-in-out infinite alternate; transform-origin: left;
}
@keyframes load { from { transform: scaleX(.05) } to { transform: scaleX(.8) } }
#board { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: default; user-select: none }
#board.panning { cursor: grabbing }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0 }
#world img { position: absolute; display: block; max-width: none; pointer-events: none }
#sharp img { background: var(--canvas) }
#marks { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.frame-title {
  position: absolute; left: 0; top: 0; max-width: 40vw; padding: 1px 4px; border-radius: 4px; overflow: hidden;
  color: var(--muted); font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; pointer-events: auto;
}
.frame-title:hover { color: var(--accent) }
.box { position: absolute; left: 0; top: 0; border: 1px solid var(--accent); border-radius: 1px }
#selected { border-width: 2px; box-shadow: 0 0 0 1px rgb(255 255 255 / .5) }
#hovered span {
  position: absolute; left: -1px; bottom: 100%; margin-bottom: 3px; padding: 0 5px; border-radius: 3px; white-space: nowrap;
  background: var(--accent); color: var(--on-accent); font-size: 11px; line-height: 17px;
}
#hint, #tools { position: absolute; z-index: 2; bottom: 12px; background: var(--bg); border-radius: var(--r); box-shadow: var(--shadow) }
#hint { left: 12px; padding: 5px 10px; color: var(--muted); font-size: 12px; pointer-events: none }
#tools { right: 12px; display: flex; align-items: center; padding: 3px }
#tools button { min-width: 28px; height: 28px; padding: 0 7px; border-radius: 6px; transition: background var(--ease) }
#tools button:hover { background: var(--hover) }
#menu {
  position: absolute; z-index: 2; left: 10px; top: 10px; width: 30px; height: 30px; border-radius: var(--r);
  background: var(--bg); box-shadow: var(--shadow); font-size: 15px;
}

/* Pages: galleries, tokens, assets */
#page { position: absolute; inset: 0; overflow-y: auto; padding: 22px clamp(16px, 4vw, 40px) 60px; background: var(--bg) }
#page h1 { margin-left: 34px; font-size: 20px; font-weight: 600; letter-spacing: -.01em }
#page > p { margin: 2px 0 18px 34px; color: var(--muted) }
#page section { margin-top: 24px }
#page h2 { margin-bottom: 10px; font-size: 14px }
#page h2 a:hover { color: var(--accent) }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)) }
.card { display: block; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color var(--ease), box-shadow var(--ease) }
a.card:hover { border-color: var(--accent); box-shadow: var(--shadow) }
.card img { display: block; width: 100%; height: 140px; padding: 12px; object-fit: scale-down; background: var(--canvas) }
.card figcaption { padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-top: 1px solid var(--line) }
.card small { margin-left: 5px; color: var(--muted) }
.grid.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)) }
.grid.small img { height: 60px; padding: 16px; background: #fff }
.grid.small figcaption { padding: 3px 6px; font-size: 11px }
.scroller { overflow-x: auto }
table { border-collapse: collapse; width: 100%; min-width: 420px }
th { padding: 6px 8px; color: var(--muted); font-weight: 500; text-align: left; white-space: nowrap }
td { padding: 3px 8px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap }
.cell { display: flex; align-items: center; gap: 8px; min-width: 150px }
.cell input { flex: 1; min-width: 0; padding: 3px 6px; background: none; border: 1px solid transparent; border-radius: 5px; transition: border-color var(--ease) }
.cell input:hover, .cell input:focus { border-color: var(--line) }
.preview { flex: none; display: grid; place-items: center; width: 24px; height: 24px; overflow: hidden }
.swatch { border: 1px solid rgb(127 127 127 / .35); border-radius: 6px }
.bar { justify-self: start; height: 8px; border-radius: 2px; background: var(--accent) }
.corner { width: 22px; height: 22px; border: 2px solid var(--accent) }

/* Inspector */
#inspector { display: flex; flex-direction: column; width: 280px; min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line) }
@media (max-width: 900px) { #inspector { position: fixed; z-index: 4; inset: 0 0 0 auto; box-shadow: var(--shadow) } }
#inspector > * { padding: 12px 14px; border-bottom: 1px solid var(--line) }
#inspector > :last-child { border: 0 }
.title { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; word-break: break-word }
.title button { flex: none; width: 22px; height: 22px; border-radius: 5px; color: var(--muted) }
.title button:hover { background: var(--hover) }
.crumbs { display: flex; flex-wrap: wrap; gap: 0 3px; margin-top: 3px; color: var(--muted); font-size: 12px }
.crumbs button { padding: 0 2px; border-radius: 3px; color: inherit }
.crumbs button:hover { color: var(--accent) }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px }
.facts dt { color: var(--muted) }
.facts dd { min-width: 0; word-break: break-word }
.facts a { color: var(--accent) }
.facts a:hover { text-decoration: underline }
.fields { display: grid; gap: 10px }
.field { display: grid; gap: 3px }
.field > span, .field > label { color: var(--muted); font-size: 12px }
.field input:not([type="checkbox"]), .field textarea {
  width: 100%; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; transition: border-color var(--ease);
}
.field textarea { min-height: 54px; resize: vertical }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: 0 }
.line { display: flex; align-items: center; gap: 8px }
.line input { flex: 1; min-width: 0 }
.check { display: flex; align-items: center; gap: 7px; color: var(--ink) !important }
.pick { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; text-align: left }
.pick:hover { border-color: var(--muted) }
.pick i, .swatches button { flex: none; display: block; width: 20px; height: 20px; border: 1px solid rgb(127 127 127 / .35); border-radius: 5px }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, 24px); gap: 4px; margin-top: 6px; padding: 6px 0 }
.swatches button { width: 24px; height: 24px; transition: transform var(--ease) }
.swatches button:hover { transform: scale(1.14) }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent) }
.writes { color: var(--muted); font-size: 12px; word-break: break-word }

#toast {
  position: fixed; z-index: 5; left: 50%; bottom: 60px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
  max-width: min(520px, calc(100vw - 32px)); padding: 7px 12px; border-radius: var(--r); background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
}
#toast.error { background: var(--danger); color: var(--bg) }
#toast button { font-weight: 600; text-decoration: underline }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
<body>
<nav id="nav" aria-label="Project">
  <header id="name"></header>
  <input id="search" type="search" placeholder="Search" aria-label="Search screens, components and tokens">
  <div id="links"></div>
</nav>
<main id="stage">
  <div id="board" hidden>
    <div id="world"><img id="base" alt=""><div id="sharp"></div></div>
    <div id="marks"><div id="titles"></div><div id="hovered" class="box" hidden><span></span></div><div id="selected" class="box" hidden></div></div>
    <p id="hint">Click any layer to inspect it. Scroll to pan, pinch to zoom.</p>
    <div id="tools" role="toolbar" aria-label="Zoom">
      <button id="undo" hidden>Undo</button>
      <button id="out" aria-label="Zoom out">−</button>
      <button id="level" aria-label="Zoom to 100%"></button>
      <button id="in" aria-label="Zoom in">+</button>
      <button id="fit">Fit</button>
    </div>
  </div>
  <div id="page" hidden></div>
  <button id="menu" aria-label="Toggle navigation">☰</button>
</main>
<aside id="inspector" aria-label="Layer" hidden></aside>
<div id="toast" role="status" hidden></div>

<script type="module">
const $ = id => document.getElementById(id)
const el = (tag, props = {}, ...kids) => {
  const node = Object.assign(document.createElement(tag), props)
  node.append(...kids.flat(Infinity).filter(kid => kid != null))
  return node
}
const query = params => new URLSearchParams(params)
const load = async response => {
  const body = await response.json()
  if (!response.ok) throw new Error(body.error)
  return body
}
const get = url => fetch(url).then(load)
const post = (url, data) => fetch(url, { method: 'POST', body: JSON.stringify(data) }).then(load)

const BASE_SCALE = 0.25
const SECTIONS = { screens: 'Screens', components: 'Components', blocks: 'Blocks' }
const clamp = (value, low, high) => Math.min(high, Math.max(low, value))
const unwrap = value => value?.value ?? value
const tokenOf = value => value?.token?.split('#')[1]
const tokenPath = token => [...token.scope, token.name].join('.')
const shortName = file => file.split('/').at(-1).replace(/\.elyx$/, '')
const sectionOf = file => (file.includes('/') ? file.split('/')[0] : '')
const local = file => file.replace(`${project.root}/`, '')
const renderUrl = (file, ref, scale) => `render?${query({ file, ...(ref && { ref }), scale, v: revision })}`

let project
let revision = 0
let view = {}
let frames = []
let selection = null
let hover = null
const camera = { x: 0, y: 0, z: 1 }

// Feedback

let toastTimer
const toast = (message, { error = false, action } = {}) => {
  clearTimeout(toastTimer)
  const box = $('toast')
  box.className = error ? 'error' : ''
  box.replaceChildren(el('span', { textContent: message }), action ?? '')
  box.hidden = false
  toastTimer = setTimeout(() => (box.hidden = true), error ? 8000 : 5000)
}
const report = cause => toast(cause.message, { error: true })

const undo = async () => {
  try {
    const { file } = await post('undo', {})
    toast(`Undid the last change to ${file}`)
  } catch (cause) {
    report(cause)
  }
}
const saved = file => {
  $('undo').hidden = false
  toast(`Saved to ${file}`, { action: el('button', { textContent: 'Undo', onclick: undo }) })
}

// Navigation

const navRow = (href, label, className = 'row') => el('a', { href, className, textContent: label, title: label })

const renderNav = () => {
  const search = $('search').value.trim().toLowerCase()
  const matches = text => !search || text.toLowerCase().includes(search)
  const rows = []

  for (const { file } of project.files.filter(item => !sectionOf(item.file) && matches(item.file))) {
    rows.push(navRow(`#board:${file}`, shortName(file) === 'index' ? 'All screens' : shortName(file)))
  }

  const sections = Object.groupBy(project.files.filter(item => sectionOf(item.file)), item => sectionOf(item.file))
  const order = name => (Object.keys(SECTIONS).indexOf(name) + 1 || 9)
  for (const name of Object.keys(sections).sort((a, b) => order(a) - order(b))) {
    const items = sections[name].filter(item => matches(item.file) || item.exports.some(({ name: symbol }) => matches(symbol)))
    if (!items.length) continue
    const count = sections[name].reduce((sum, item) => sum + item.exports.length, 0)
    rows.push(el('a', { href: `#gallery:${name}`, className: 'group' }, SECTIONS[name] ?? name, el('span', { className: 'muted', textContent: count })))
    for (const item of items) {
      rows.push(navRow(`#board:${item.file}`, shortName(item.file)))
      if (item.exports.length < 2 || !(search || view.file === item.file)) continue
      for (const { name: symbol } of item.exports.filter(({ name: symbol }) => matches(symbol) || matches(item.file))) {
        rows.push(navRow(`#board:${item.file}:${symbol}`, symbol, 'row sub'))
      }
    }
  }

  const groups = Object.groupBy(project.tokens, token => token.rootScope[0])
  const shown = Object.keys(groups).filter(name => matches(name) || groups[name].some(token => matches(token.name)))
  if (shown.length) {
    rows.push(el('a', { href: '#tokens', className: 'group' }, 'Tokens', el('span', { className: 'muted', textContent: project.tokens.length })))
    rows.push(shown.map(name => navRow(`#tokens:${name}`, name)))
  }

  if ((project.images.length || project.fonts.length) && matches('assets')) {
    rows.push(el('a', { href: '#assets', className: 'group' }, 'Assets', el('span', { className: 'muted', textContent: project.images.length + project.fonts.length })))
  }

  $('links').replaceChildren(...rows.flat())
  for (const link of $('links').querySelectorAll('a')) {
    if (link.getAttribute('href') === location.hash) link.setAttribute('aria-current', 'page')
  }
}

// Pages

const showPage = (...content) => {
  $('board').hidden = true
  $('page').hidden = false
  $('page').replaceChildren(...content.flat(Infinity).filter(Boolean))
}

const galleryPage = name => {
  const files = project.files.filter(item => sectionOf(item.file) === name && item.exports.length)
  const count = files.reduce((sum, item) => sum + item.exports.length, 0)
  showPage(
    el('h1', { textContent: SECTIONS[name] ?? name }),
    el('p', { textContent: `${count} in ${files.length} files. Open one to click through its layers.` }),
    files.map(({ file, exports }) =>
      el('section', {},
        el('h2', {}, el('a', { href: `#board:${file}`, textContent: shortName(file) })),
        el('div', { className: 'grid' }, exports.map(({ name: symbol, variant }) =>
          el('a', { className: 'card', href: `#board:${file}:${symbol}` },
            el('figure', {},
              el('img', { srcset: `${renderUrl(file, symbol, 2)} 2x`, alt: `${symbol} preview`, loading: 'lazy', onerror: event => event.target.remove() }),
              el('figcaption', { title: symbol }, symbol, variant ? el('small', { textContent: 'variant' }) : null))))))),
  )
}

const contextName = context => Object.entries(context).map(([axis, value]) => `${axis}=${value}`).join(', ') || 'Default'

const tokenPreview = token => {
  if (!token) return el('span', { className: 'preview' })
  if (token.type === 'color') return el('span', { className: 'preview swatch', style: `background:${token.value}` })
  const size = Number.parseFloat(token.value)
  if (token.type !== 'number' || Number.isNaN(size)) return el('span', { className: 'preview' })
  const group = token.rootScope[0]
  if (/radius/i.test(group)) return el('span', { className: 'preview' }, el('span', { className: 'corner', style: `border-radius:${Math.min(size, 11)}px` }))
  if (/font/i.test(group)) return el('span', { className: 'preview', style: `font-size:${Math.min(size, 22)}px`, textContent: 'Aa' })
  return el('span', { className: 'preview' }, el('span', { className: 'bar', style: `width:${clamp(size / (size > 100 ? 40 : 2), 1, 24)}px` }))
}

const tokenCell = (token, column, name) => {
  const input = el('input', {
    value: token?.literal ?? '',
    placeholder: token ? '' : 'inherits',
    disabled: column.nested,
    ariaLabel: `${name}, ${column.title}`,
    onchange: async () => {
      if (!input.value.trim()) return
      try {
        saved((await post('token', { file: column.file, scope: column.scope, name, value: input.value.trim() })).file)
      } catch (cause) {
        input.value = input.defaultValue
        report(cause)
      }
    },
    onkeydown: event => event.key === 'Enter' && input.blur(),
  })
  return el('td', {}, el('div', { className: 'cell' }, tokenPreview(token), input))
}

const tokenTable = (group, list) => {
  const tokens = list.toSorted((a, b) => Object.keys(a.context).length - Object.keys(b.context).length)
  const columns = [...new Map(tokens.map(({ context, scope, file }) => [
    JSON.stringify(context),
    { context, scope: scope[0], file, title: contextName(context), nested: scope.length > 1 },
  ])).values()]
  const names = [...new Set(tokens.map(token => token.name))]
  const find = (name, column) => tokens.find(token => token.name === name && JSON.stringify(token.context) === JSON.stringify(column.context))
  return el('section', { id: `group-${group}` },
    el('h2', { textContent: group }),
    el('div', { className: 'scroller' }, el('table', {},
      el('thead', {}, el('tr', {}, el('th', { textContent: 'Token' }), columns.map(column => el('th', { textContent: column.title })))),
      el('tbody', {}, names.map(name => el('tr', {},
        el('td', { className: 'mono', textContent: name }),
        columns.map(column => tokenCell(find(name, column), column, name))))))))
}

const tokensPage = group => {
  const groups = Object.groupBy(project.tokens, token => token.rootScope[0])
  const shown = group ? [group] : Object.keys(groups)
  showPage(
    el('h1', { textContent: group ?? 'Tokens' }),
    el('p', { textContent: 'Edit a value and press Enter. Every layer that uses the token follows.' }),
    shown.map(name => tokenTable(name, groups[name] ?? [])),
  )
}

const assetsPage = () => {
  const folders = Object.groupBy(project.images, image => image.split('/').slice(0, -1).join('/') || 'Images')
  showPage(
    el('h1', { textContent: 'Assets' }),
    el('p', { textContent: `${project.images.length} images, ${project.fonts.length} fonts.` }),
    Object.entries(folders).map(([folder, images]) => el('section', {},
      el('h2', { textContent: folder }),
      el('div', { className: 'grid small' }, images.map(image => el('figure', { className: 'card' },
        el('img', { src: `asset?${query({ path: image })}`, alt: image, loading: 'lazy' }),
        el('figcaption', { title: image, textContent: image.split('/').at(-1) })))))),
    project.fonts.length ? el('section', {}, el('h2', { textContent: 'Fonts' }), project.fonts.map(font => el('div', { className: 'mono', textContent: font }))) : null,
  )
}

// The board

const bounds = () => ({
  x: 0,
  y: 0,
  w: Math.max(...frames.map(frame => frame.x + frame.w)),
  h: Math.max(...frames.map(frame => frame.y + frame.h)),
})

const paint = () => {
  $('world').style.transform = `translate(${camera.x}px,${camera.y}px) scale(${camera.z})`
  for (const frame of frames) {
    const title = frame.title
    title.style.transform = `translate(${frame.x * camera.z + camera.x - 4}px,${frame.y * camera.z + camera.y - 20}px)`
    title.style.maxWidth = `${Math.max(frame.w * camera.z, 60)}px`
  }
  $('level').textContent = `${Math.round(camera.z * 100)}%`
  drawBox($('hovered'), hover)
  drawBox($('selected'), selection && { frame: selection.frame, trail: trailOf(selection) })
  clearTimeout(paint.timer)
  paint.timer = setTimeout(sharpen, 140)
}

const rectOf = ({ frame, trail }) => {
  const rect = { x: frame.x, y: frame.y, w: trail.at(-1).resolvedSize.width, h: trail.at(-1).resolvedSize.height }
  for (const layer of trail.slice(1)) {
    rect.x += layer.position.x
    rect.y += layer.position.y
  }
  return rect
}

const drawBox = (box, target) => {
  box.hidden = !target
  if (!target) return
  const { x, y, w, h } = rectOf(target)
  box.style.transform = `translate(${x * camera.z + camera.x}px,${y * camera.z + camera.y}px)`
  box.style.width = `${w * camera.z}px`
  box.style.height = `${h * camera.z}px`
  box.querySelector('span')?.replaceChildren(target.trail.at(-1).name)
}

const fit = ({ x, y, w, h }, most = 4) => {
  const { width, height } = $('board').getBoundingClientRect()
  camera.z = Math.min(most, (width - 96) / w, (height - 96) / h)
  camera.x = (width - w * camera.z) / 2 - x * camera.z
  camera.y = (height - h * camera.z) / 2 - y * camera.z
  paint()
}

const zoomAt = (factor, x, y) => {
  const z = clamp(camera.z * factor, 0.02, 16)
  camera.x = x - ((x - camera.x) * z) / camera.z
  camera.y = y - ((y - camera.y) * z) / camera.z
  camera.z = z
  paint()
}

// Loads a crisper render of each frame in view once the base image runs out of pixels.
const sharpen = () => {
  const density = camera.z * devicePixelRatio
  if (density <= BASE_SCALE) return
  const want = [1, 2, 4].find(scale => scale >= density) ?? 4
  const { width, height } = $('board').getBoundingClientRect()
  for (const frame of frames) {
    const left = frame.x * camera.z + camera.x
    const top = frame.y * camera.z + camera.y
    const isVisible = left < width && top < height && left + frame.w * camera.z > 0 && top + frame.h * camera.z > 0
    if (!isVisible || frame.scale >= want) continue
    frame.scale = want
    const image = el('img', {
      alt: '',
      src: renderUrl(frame.source.file, frame.source.ref, want),
      style: `left:${frame.x}px;top:${frame.y}px;width:${frame.w}px;height:${frame.h}px`,
      onload: () => {
        frame.image?.remove()
        frame.image = image
        $('sharp').append(image)
      },
    })
  }
}

const treeOf = frame => (frame.tree ??= get(`layers?${query(frame.source)}`).then(tree => (frame.layers = tree), report))

const point = event => {
  const { left, top } = $('board').getBoundingClientRect()
  return { x: event.clientX - left, y: event.clientY - top }
}
const toWorld = ({ x, y }) => ({ x: (x - camera.x) / camera.z, y: (y - camera.y) / camera.z })

const frameAt = ({ x, y }) => frames.findLast(frame => x >= frame.x && y >= frame.y && x < frame.x + frame.w && y < frame.y + frame.h)

// The deepest visible layer at a board point. A frame's children only count
// inside it, because frames clip.
const pick = (frame, { x, y }) => {
  if (!frame.layers) return null
  const trail = [frame.layers]
  const path = []
  let left = frame.x
  let top = frame.y
  for (;;) {
    const children = trail.at(-1).children ?? []
    const index = children.findLastIndex(layer => {
      const size = layer.resolvedSize
      const lx = left + (layer.position?.x ?? 0)
      const ly = top + (layer.position?.y ?? 0)
      return !layer.hidden && size?.width && x >= lx && y >= ly && x < lx + size.width && y < ly + size.height
    })
    if (index < 0) return { frame, trail, path }
    left += children[index].position.x
    top += children[index].position.y
    trail.push(children[index])
    path.push(index)
  }
}

// Selections keep child indexes, so they survive the tree reloading after an edit.
const trailOf = ({ frame, path }) => {
  const trail = [frame.layers]
  for (const index of path) {
    const next = trail.at(-1)?.children?.[index]
    if (!next) break
    trail.push(next)
  }
  return trail
}

const select = target => {
  selection = target && { frame: target.frame, path: target.path }
  if (target) $('hint').hidden = true
  renderInspector()
  paint()
}

// Inspector

const numberScale = pattern => {
  const numbers = project.tokens.filter(token => token.type === 'number' && !Object.keys(token.context).length && token.scope.length === 1)
  const fitting = numbers.filter(token => pattern.test(tokenPath(token)))
  return fitting.length ? fitting : numbers
}
const colorTokens = () => project.tokens.filter(token => token.type === 'color' && !Object.keys(token.context).length)
const tokenValue = token => ({ token: `${token.file}#${tokenPath(token)}` })

const paddingOf = layer => {
  const padding = layer.layout?.padding
  if (!padding) return undefined
  const sides = Object.values(padding)
  return sides.every(side => unwrap(side) === unwrap(sides[0])) ? padding.top : { value: sides.map(unwrap).join(' ') }
}

const FIELDS = [
  { prop: 'font-size', label: 'Font size', scale: /font/i, unit: '', read: layer => layer.text?.font?.size },
  { prop: 'corner-radius', label: 'Radius', scale: /radius/i, unit: 'px', read: layer => (layer.type === 'frame' ? (layer.style?.cornerRadius ?? 0) : undefined) },
  { prop: 'layout.item-gap', label: 'Gap', scale: /space|gap/i, unit: 'px', read: layer => (layer.layout?.type === 'stack' ? layer.layout.gap : undefined) },
  { prop: 'padding', label: 'Padding', scale: /space|gap/i, unit: 'px', read: paddingOf },
]

const apply = async (layer, prop, value) => {
  try {
    saved((await post('edit', { target: layer.target, prop, value })).file)
  } catch (cause) {
    report(cause)
    renderInspector()
  }
}

const textField = layer => {
  const input = el('textarea', {
    id: 'field-contents',
    defaultValue: layer.text.content,
    onchange: () => apply(layer, 'contents', { text: input.value }),
    onkeydown: event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault()
        input.blur()
      }
    },
  })
  return el('div', { className: 'field' }, el('label', { htmlFor: 'field-contents', textContent: 'Text' }), input)
}

const colorField = layer => {
  const fill = layer.style?.fills?.[0]
  const color = fill?.color
  const current = tokenOf(color)
  const swatches = el('div', { className: 'swatches', hidden: true }, colorTokens().map(token =>
    el('button', {
      title: tokenPath(token),
      ariaLabel: tokenPath(token),
      ariaPressed: String(tokenPath(token) === current),
      style: `background:${token.value}`,
      onclick: () => apply(layer, 'fill', tokenValue(token)),
    })))
  const custom = el('input', {
    placeholder: '#hex, when no token fits',
    ariaLabel: 'Custom color',
    onchange: () => apply(layer, 'fill', { raw: custom.value.trim() }),
  })
  const toggle = el('button', {
    className: 'pick',
    ariaExpanded: 'false',
    onclick: () => {
      swatches.hidden = !swatches.hidden
      custom.hidden = swatches.hidden
      toggle.ariaExpanded = String(!swatches.hidden)
    },
  }, el('i', { style: `background:${unwrap(color) ?? 'transparent'}` }), current ?? unwrap(color) ?? 'None')
  custom.hidden = true
  return el('div', { className: 'field' }, el('span', { textContent: layer.type === 'text' ? 'Color' : 'Fill' }), toggle, swatches, custom)
}

const numberField = (layer, { prop, label, scale, unit }, value) => {
  const tokens = numberScale(scale)
  const id = `field-${prop}`
  const shown = tokenOf(value) ?? String(unwrap(value))
  const input = el('input', {
    id,
    defaultValue: shown,
    onchange: () => {
      const text = input.value.trim()
      const token = tokens.find(candidate => tokenPath(candidate) === text)
      if (token) return apply(layer, prop, tokenValue(token))
      if (Number.isNaN(Number(text)) || !text) {
        input.value = shown
        return report(new Error(`Use a number or a token, not ${text || 'nothing'}.`))
      }
      apply(layer, prop, { raw: `${Number(text)}${unit}` })
    },
    onkeydown: event => event.key === 'Enter' && input.blur(),
  })
  input.setAttribute('list', `${id}-tokens`)
  return el('div', { className: 'field' },
    el('label', { htmlFor: id, textContent: label }),
    el('div', { className: 'line' }, input, tokenOf(value) ? el('span', { className: 'muted', textContent: unwrap(value) }) : null),
    el('datalist', { id: `${id}-tokens` }, tokens.map(token => el('option', { value: tokenPath(token), label: String(token.value) }))))
}

const visibleField = layer => {
  const input = el('input', {
    type: 'checkbox',
    checked: !layer.hidden,
    onchange: () => apply(layer, 'display', { raw: input.checked ? '.visible' : '.hidden' }),
  })
  return el('div', { className: 'field' }, el('label', { className: 'check' }, input, 'Visible'))
}

const renderInspector = () => {
  const inspector = $('inspector')
  inspector.hidden = !selection
  if (!selection) return
  const trail = trailOf(selection)
  const layer = trail.at(-1)
  const base = layer.instanceOf
  const facts = [
    ['Size', `${Math.round(layer.resolvedSize.width)} × ${Math.round(layer.resolvedSize.height)}`],
    base && ['Instance of', el('a', { href: `#board:${local(base.file)}:${base.symbol}`, textContent: `${shortName(base.file)} / ${base.symbol}` })],
    layer.meta?.code && ['Code', el('span', { className: 'mono', textContent: layer.meta.code })],
  ].filter(Boolean)
  const canColor = layer.type === 'text' || layer.type === 'frame' || layer.type === 'asset'
  const fields = [
    layer.text ? textField(layer) : null,
    canColor && (!layer.style?.fills?.length || layer.style.fills[0].color) ? colorField(layer) : null,
    FIELDS.map(field => {
      const value = field.read(layer)
      return value === undefined || value === null ? null : numberField(layer, field, value)
    }),
    visibleField(layer),
  ]
  inspector.replaceChildren(
    el('header', {},
      el('div', { className: 'title' },
        el('h2', { textContent: layer.name }),
        el('button', { ariaLabel: 'Close', textContent: '✕', onclick: () => select(null) })),
      el('div', { className: 'crumbs' }, trail.slice(0, -1).flatMap((step, index) => [
        el('button', { textContent: step.name, onclick: () => select({ frame: selection.frame, path: selection.path.slice(0, index) }) }),
        '›',
      ]), el('span', { textContent: layer.type }))),
    el('dl', { className: 'facts' }, facts.flatMap(([term, detail]) => [el('dt', { textContent: term }), el('dd', {}, detail)])),
    el('div', { className: 'fields' }, fields),
    el('p', { className: 'writes', textContent: `Changes here apply to ${local(layer.target.filePath)}. Open the component to change every instance.` }),
  )
}

// Routing and live updates

const openBoard = async (file, focus) => {
  const isSameFile = view.kind === 'board' && view.file === file
  view = { kind: 'board', file, focus }
  $('page').hidden = true
  $('board').hidden = false
  if (!isSameFile) {
    select(null)
    await loadBoard()
    if (!frames.length) return showPage(el('h1', { textContent: shortName(file) }), el('p', { textContent: 'This file draws nothing.' }))
    return moveTo(focus, 1)
  }
  moveTo(focus, 4)
}

const moveTo = (focus, most) => {
  const frame = frames.find(item => item.name === focus)
  fit(frame ?? bounds(), frame ? 4 : most)
}

const loadBoard = async () => {
  const stage = $('stage')
  stage.classList.add('busy')
  try {
    const previous = frames
    const { frames: loaded } = await get(`board?${query({ file: view.file })}`)
    const left = Math.min(...loaded.map(frame => frame.x))
    const top = Math.min(...loaded.map(frame => frame.y))
    frames = loaded.map(frame => {
      const old = previous.find(item => item.name === frame.name)
      const title = el('button', {
        className: 'frame-title',
        textContent: frame.name,
        onpointerdown: event => event.stopPropagation(),
        onclick: async () => {
          await treeOf(next)
          select({ frame: next, path: [] })
        },
      })
      const next = { ...frame, x: frame.x - left, y: frame.y - top, title, scale: 0, image: old?.image }
      return next
    })
    for (const { image } of previous) if (image && !frames.some(frame => frame.image === image)) image.remove()
    $('titles').replaceChildren(...frames.map(frame => frame.title))
    if (!frames.length) return
    const size = bounds()
    const base = $('base')
    base.style.cssText = `width:${size.w}px;height:${size.h}px`
    base.src = renderUrl(view.file, null, BASE_SCALE)
    await base.decode().catch(() => {})
    if (camera.z * devicePixelRatio <= BASE_SCALE) {
      for (const frame of frames) {
        frame.image?.remove()
        frame.image = undefined
      }
    }
  } catch (cause) {
    report(cause)
  } finally {
    stage.classList.remove('busy')
  }
}

const route = async () => {
  const [kind, first, second] = decodeURIComponent(location.hash.slice(1)).split(':')
  try {
    if (kind === 'board' && first) await openBoard(first, second)
    else {
      view = { kind, first }
      select(null)
      if (kind === 'gallery') galleryPage(first)
      else if (kind === 'tokens') tokensPage(first)
      else if (kind === 'assets') assetsPage()
      else location.hash = `#board:${project.opened}`
    }
  } catch (cause) {
    report(cause)
  }
  renderNav()
}

const isTyping = () => {
  const active = document.activeElement
  return active?.matches('input, textarea') && active.value !== active.defaultValue
}

let refreshing = false
let stale = false
const refresh = async () => {
  if (refreshing) return void (stale = true)
  refreshing = true
  try {
    project = await get('project')
    applyCanvas()
    renderNav()
    if (view.kind === 'board') {
      const chosen = selection && { name: selection.frame.name, path: selection.path }
      await loadBoard()
      paint()
      const frame = chosen && frames.find(item => item.name === chosen.name)
      if (frame) {
        await treeOf(frame)
        selection = { frame, path: chosen.path }
      } else selection = null
      if (!isTyping()) renderInspector()
      paint()
    } else if (!isTyping()) {
      await route()
    }
  } catch (cause) {
    report(cause)
  }
  refreshing = false
  if (stale) {
    stale = false
    refresh()
  }
}

const applyCanvas = () => {
  if (project.canvas) document.documentElement.style.setProperty('--canvas', project.canvas)
}

// Input

const board = $('board')
let drag = null

board.addEventListener('wheel', event => {
  event.preventDefault()
  const { x, y } = point(event)
  if (event.ctrlKey || event.metaKey) return zoomAt(Math.exp(-event.deltaY * 0.01), x, y)
  camera.x -= event.deltaX
  camera.y -= event.deltaY
  paint()
}, { passive: false })

board.addEventListener('pointerdown', event => {
  if (event.button || event.target.closest('#tools')) return
  drag = { x: event.clientX, y: event.clientY, moved: false }
  board.setPointerCapture(event.pointerId)
})

board.addEventListener('pointermove', event => {
  if (drag) {
    const dx = event.clientX - drag.x
    const dy = event.clientY - drag.y
    if (!drag.moved && Math.hypot(dx, dy) < 4) return
    drag = { x: event.clientX, y: event.clientY, moved: true }
    board.classList.add('panning')
    camera.x += dx
    camera.y += dy
    return paint()
  }
  const at = toWorld(point(event))
  const frame = frameAt(at)
  if (frame) treeOf(frame)
  hover = frame ? pick(frame, at) : null
  drawBox($('hovered'), hover)
})

board.addEventListener('pointerup', async event => {
  const wasClick = drag && !drag.moved
  drag = null
  board.classList.remove('panning')
  if (!wasClick) return
  const at = toWorld(point(event))
  const frame = frameAt(at)
  if (!frame) return select(null)
  await treeOf(frame)
  if (frames.includes(frame)) select(pick(frame, at))
})

board.addEventListener('pointerleave', () => {
  hover = null
  drawBox($('hovered'), null)
})

board.addEventListener('dblclick', event => {
  if (event.target.closest('#tools')) return
  const frame = frameAt(toWorld(point(event)))
  if (frame) fit(frame)
})

const center = () => {
  const { width, height } = board.getBoundingClientRect()
  return [width / 2, height / 2]
}
$('in').onclick = () => zoomAt(1.4, ...center())
$('out').onclick = () => zoomAt(1 / 1.4, ...center())
$('level').onclick = () => zoomAt(1 / camera.z, ...center())
$('fit').onclick = () => fit(bounds())
$('undo').onclick = undo
$('menu').onclick = () => {
  document.body.classList.toggle('no-nav')
  if (view.kind === 'board') paint()
}
$('search').oninput = renderNav

addEventListener('keydown', event => {
  if (event.target.matches('input, textarea')) return
  if ((event.metaKey || event.ctrlKey) && event.key === 'z') {
    event.preventDefault()
    return undo()
  }
  if (event.metaKey || event.ctrlKey || view.kind !== 'board') return
  if (event.key === 'Escape' && selection) select(selection.path.length ? { frame: selection.frame, path: selection.path.slice(0, -1) } : null)
  if (event.key === '+' || event.key === '=') zoomAt(1.4, ...center())
  if (event.key === '-') zoomAt(1 / 1.4, ...center())
  if (event.key === '0') fit(bounds())
})
addEventListener('hashchange', route)
addEventListener('resize', () => view.kind === 'board' && paint())

if (innerWidth < 640) document.body.classList.add('no-nav')
try {
  project = await get('project')
  document.title = `${project.name} · Elyx`
  $('name').textContent = project.name
  applyCanvas()
  await route()
  new EventSource('events').onmessage = event => {
    revision = Number(event.data)
    refresh()
  }
} catch (cause) {
  report(cause)
}
</script>
</html>
